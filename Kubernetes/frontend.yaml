apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name:  frontend
          image: public.ecr.aws/m1f0t2e1/frontend
          imagePullPolicy: Always
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_URL
              value: "http://http://a3e0360c8f9dc470caf7c60de25203b6-837670652.us-east-1.elb.amazonaws.com:8000"
          resources:
            requests:
              cpu: "250m"
              memory: "0.5Gi"
            limits:
              cpu: "500m"
              memory: "1Gi"

                #imagePullSecrets:
        #    - name: ecr-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: app
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 5173
      targetPort: 5173
  type: LoadBalancer

---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: server-hpa
  namespace: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
