namespace: dev

deployFrontend: false
deployBackend: false
deployPostgres: false
deployIngress: true

rules:
  - frontend_host: dev.sogbae.click
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend-dev
              port:
                number: 5173
  - backend_host: dev-app.sogbae.click
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: backend-dev
              port:
                number: 8000

