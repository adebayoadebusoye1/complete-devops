# Ingress resource for the application
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: sogbae.click
    http:
      paths:
      # Frontend service on port 5173
      - path: /
        pathType: Prefix
        frontend:
          service:
            name: frontend
            port:
              number: 5173
      # Backend service on port 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      # Postgres service on port 5432 (optional, depending on your setup)
      - path: /
        pathType: Prefix
        postgres:
          service:
            name: postgres
            port:
              number: 5432
